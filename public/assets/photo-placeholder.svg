<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative grid background -->
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="80" y1="0" x2="80" y2="400" stroke-dasharray="4 4"/>
    <line x1="160" y1="0" x2="160" y2="400" stroke-dasharray="4 4"/>
    <line x1="240" y1="0" x2="240" y2="400" stroke-dasharray="4 4"/>
    <line x1="320" y1="0" x2="320" y2="400" stroke-dasharray="4 4"/>
    <line x1="0" y1="80" x2="400" y2="80" stroke-dasharray="4 4"/>
    <line x1="0" y1="160" x2="400" y2="160" stroke-dasharray="4 4"/>
    <line x1="0" y1="240" x2="400" y2="240" stroke-dasharray="4 4"/>
    <line x1="0" y1="320" x2="400" y2="320" stroke-dasharray="4 4"/>
  </g>

  <!-- Outer Ring Glow -->
  <circle cx="200" cy="180" r="110" fill="none" stroke="url(#ringGrad)" stroke-width="2"/>

  <!-- Minimalist Portrait Silhouette -->
  <!-- Head -->
  <circle cx="200" cy="140" r="50" fill="#334155"/>
  <circle cx="200" cy="140" r="48" fill="url(#avatarGrad)" opacity="0.25"/>

  <!-- Torso & Shoulders -->
  <path d="M110 300 C110 230 150 210 200 210 C250 210 290 230 290 300" fill="#334155"/>
  <path d="M114 300 C114 233 152 214 200 214 C248 214 286 233 286 300" fill="url(#avatarGrad)" opacity="0.25"/>

  <!-- Neat Status Tag Pill -->
  <rect x="110" y="335" width="180" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <circle cx="132" cy="352" r="4" fill="#3b82f6"/>
  <text x="204" y="357" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">PHOTO PENDING</text>
</svg>
